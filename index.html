        .blob.b3{width:500px;height:500px;background:radial-gradient(circle at 40% 40%, var(--peach), transparent 70%);left:10%;bottom:-160px;opacity:0.35;animation:blobMove 20s ease-in-out infinite}

        .shell{position:relative;z-index:1;width:100%;max-width:580px}
        .brand{
          text-align:center;margin:6px 0 18px;position:relative;
        }
        .brand-badge{
          display:inline-flex;align-items:center;gap:8px;
          background:rgba(91,140,255,0.12);border:1px solid rgba(91,140,255,0.22);
          padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--blue);
        }
        .brand h1{
          font-family:"Bricolage Grotesque",Outfit,sans-serif;
          font-weight:800;font-size:clamp(30px,8vw,42px);line-height:0.95;letter-spacing:-0.04em;
          margin:14px 0 8px;
        }
        .brand h1 span.blue{color:var(--blue)}
        .brand h1 span.mint{color:var(--mint)}
        .brand p{color:var(--muted);font-size:15px;font-weight:600}
        .card{
          background:linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.05));
          border:1px solid var(--line);
          border-radius:32px;
          padding:22px;
          backdrop-filter:blur(22px) saturate(1.2);
          -webkit-backdrop-filter:blur(22px) saturate(1.2);
          box-shadow:0 18px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
          position:relative;overflow:hidden;
        }
        .card::before{
          content:"";position:absolute;inset:0;border-radius:32px;pointer-events:none;
          background:radial-gradient(600px 200px at 10% -20%, rgba(91,140,255,0.18), transparent), radial-gradient(400px 200px at 90% -10%, rgba(166,255,210,0.12), transparent);
        }
        .card>*{position:relative;z-index:1}
        .label{font-size:12px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 4px;display:block}
        .field{margin-bottom:16px}
        .input{
          width:100%;background:rgba(14,17,26,0.7);border:1.5px solid rgba(255,255,255,0.14);
          border-radius:18px;padding:14px 16px;color:var(--text);font-size:16px;font-weight:600;
          outline:none;transition:all .2s;
        }
        .input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(91,140,255,0.18);background:rgba(14,17,26,0.9)}
        .input::placeholder{color:#6B7594}
        .num{font-family:"JetBrains Mono",monospace;text-align:center;font-weight:800;font-size:18px;letter-spacing:-0.02em}
        .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .time-row{display:flex;gap:10px;align-items:center}
        .time-row .sep{font-weight:800;font-size:22px;color:var(--muted)}
        .seg{
          display:flex;background:rgba(14,17,26,0.7);border:1.5px solid rgba(255,255,255,0.14);border-radius:18px;padding:4px;gap:4px;flex:1;
        }
        .seg button{
          flex:1;border:0;border-radius:12px;padding:10px 0;font-weight:800;font-size:13px;letter-spacing:0.06em;cursor:pointer;
          background:transparent;color:var(--muted);transition:all .2s;
        }
        .seg button[aria-checked="true"]{background:var(--blue);color:#0E111A;box-shadow:0 4px 14px rgba(91,140,255,0.4)}
        .conv{font-size:12px;font-weight:700;color:var(--blue);min-height:18px;margin-top:6px;letter-spacing:0.02em}
        .explain{
          background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.14);border-radius:20px;padding:14px 14px 12px;
          font-size:13px;line-height:1.5;color:#CBD4F0;
        }
        .explain h3{font-size:12px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;color:var(--mint);margin:0 0 8px}
        .bar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:10px 0 4px}
        .bar i{flex:1}
        .bar i:first-child{background:linear-gradient(90deg,#2A324D,#3A466E)}
        .bar i:last-child{background:linear-gradient(90deg,var(--blue),var(--mint))}
        .barlbl{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:0.04em}
        .btn-primary{

          color:#0E111A;font-weight:800;font-size:16px;letter-spacing:-0.01em;
          cursor:pointer;box-shadow:0 10px 24px rgba(91,140,255,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
          transition:transform .15s,filter .2s,box-shadow .2s;

        .btn-ghost{

        .btn-ghost:hover{background:rgba(255,255,255,0.10)}
        .err{color:#FF9AA2;font-size:13px;font-weight:700;min-height:20px;margin:-4px 0 10px 4px}
